version: '3.8'

services:
  # Main ML Trading Application with GPU
  ml-trader:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: ml-trader:gpu
    container_name: ml_trader_gpu
    runtime: nvidia  # Enable NVIDIA runtime
    environment:
      - NVIDIA_VISIBLE_DEVICES=0  # Use RTX 4090
      - CUDA_VISIBLE_DEVICES=0
      - TRADING_MODE=paper  # paper or live
      - LOG_LEVEL=INFO
      - MODEL_DEVICE=cuda
      - ENABLE_CONTINUOUS_LEARNING=true
      - RETRAIN_INTERVAL_HOURS=24
      - MONGODB_URI=mongodb://mongo:27017/trading
      - REDIS_URL=redis://redis:6379
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=trading
      - INFLUXDB_BUCKET=market_data
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    networks:
      - trading-network
    depends_on:
      - mongo
      - redis
      - influxdb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # MongoDB for data storage
  mongo:
    image: mongo:7.0
    container_name: trading_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=trading
    volumes:
      - mongo-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - trading-network
    ports:
      - "27017:27017"
    restart: unless-stopped

  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    ports:
      - "6379:6379"
    restart: unless-stopped

  # InfluxDB for time series market data
  influxdb:
    image: influxdb:2.7
    container_name: trading_influxdb
    environment:
      - INFLUXDB_DB=trading
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - trading-network
    ports:
      - "8086:8086"
    restart: unless-stopped

  # Grafana for monitoring
  grafana:
    image: grafana/grafana:10.2.0
    container_name: trading_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - trading-network
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    restart: unless-stopped

  # TensorBoard for ML monitoring
  tensorboard:
    image: tensorflow/tensorflow:2.14.0-gpu
    container_name: trading_tensorboard
    command: tensorboard --logdir=/logs --bind_all
    volumes:
      - ./logs:/logs:ro
    networks:
      - trading-network
    ports:
      - "6006:6006"
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: trading_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - trading-network
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ML Flow for experiment tracking (optional)
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.0
    container_name: trading_mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    networks:
      - trading-network
    ports:
      - "5000:5000"
    restart: unless-stopped

networks:
  trading-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  prometheus-data:
  mlflow-data: 